[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegvid"
version = "0.1.0"
description = "BioSemi ActiveTwo acquisition with synchronized video recording"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PySide6>=6.6",
    "av>=12",  # frame-accurate video reading in the review window (OpenCV seeking isn't)
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
# Offline analysis (alignment / calibration). Not bundled into the recorder app.
analysis = ["mne>=1.6", "pandas>=2.0"]
dev = ["pytest>=7", "pyinstaller>=6.3", "mne>=1.6", "pandas>=2.0"]

[project.scripts]
eegvid-align = "eegvid.analysis.align:main"

[project.gui-scripts]
eegvid = "eegvid.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
