name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # macos-15-intel: BioSemi's Mac library is Intel-only, so this is the build
        # that can talk to hardware (runs under Rosetta on Apple Silicon until macOS 28).
        # macos-latest (Apple Silicon) builds a simulator-only app.
        os: [windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pyinstaller packaging/eegvid.spec --noconfirm
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/EEGVideoRecorder -DestinationPath EEGVideoRecorder-windows-${{ runner.arch }}.zip
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/EEG Video Recorder.app" EEGVideoRecorder-macos-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EEGVideoRecorder-${{ runner.os }}-${{ runner.arch }}
          path: EEGVideoRecorder-*.zip
